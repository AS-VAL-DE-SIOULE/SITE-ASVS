# ============================================================
#  AS VAL DE SIOULE — configuration du back-office
# ------------------------------------------------------------
#  Ce fichier décrit les modules modifiables depuis /admin/.
#  Pour ajouter un champ à un module, ajoutez une ligne dans
#  la section "fields" correspondante.
# ============================================================

backend:
  name: git-gateway
  branch: main          # ← si votre dépôt utilise "master", changez ici

locale: fr
publish_mode: simple

# Tout ce que vous téléversez (photos, vidéos, PDF) atterrit ici
media_folder: "assets/medias"
public_folder: "/assets/medias"

site_url: /
logo_url: /assets/img/logo.png

collections:

  # ----------------------------------------------------------
  - name: "contenu"
    label: "Contenu du site"
    files:

      # ------------------ INFOS DU CLUB ------------------
      - name: "club"
        label: "Infos générales du club"
        file: "content/club.json"
        description: "Nom, adresse, e-mails, liens. Ces informations alimentent tout le site."
        fields:
          - { name: nom, label: "Nom du club", widget: string }
          - { name: fondation, label: "Année de fondation", widget: number, value_type: int }
          - { name: affiliation, label: "Numéro d'affiliation FFF", widget: string }
          - { name: saison, label: "Saison en cours", widget: string, hint: "Exemple : 2026 / 2027" }
          - { name: directeurPublication, label: "Directeur de la publication", widget: string, hint: "Le président du club. Apparaît dans les mentions légales." }
          - { name: adresseSiege, label: "Adresse du siège social", widget: string, hint: "Adresse complète figurant sur les statuts." }
          - { name: rna, label: "Numéro RNA de l'association", widget: string, required: false, default: "", hint: "Le numéro W03… du récépissé de préfecture. La ligne disparaît des mentions légales tant qu'il est vide." }
          - { name: email, label: "E-mail général (adresse FFF)", widget: string }
          - { name: emailPartenaires, label: "E-mail partenariats / sponsoring", widget: string }
          - { name: stade, label: "Nom du stade", widget: string }
          - { name: ville, label: "Commune du stade", widget: string }
          - { name: codePostal, label: "Code postal", widget: string }
          - { name: communes, label: "Communes du club", widget: list, hint: "Une commune par ligne" }
          - { name: facebook, label: "Adresse de la page Facebook", widget: string }
          - { name: boutique, label: "Adresse de la boutique en ligne", widget: string }
          - { name: licencies, label: "Nombre de licenciés", widget: number, value_type: int }

      # ------------------ ACTUALITÉS ------------------
      - name: "actualites"
        label: "Actualités"
        file: "content/actualites.json"
        description: "Les actualités affichées sur l'accueil et la page Actualités. La plus récente s'affiche en premier."
        fields:
          - name: liste
            label: "Actualités"
            label_singular: "une actualité"
            widget: list
            summary: "{{fields.date}} — {{fields.titre}}"
            collapsed: true
            fields:
              - { name: date, label: "Date", widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
              - name: categorie
                label: "Catégorie"
                widget: select
                default: club
                options:
                  - { label: "Sportif", value: "sportif" }
                  - { label: "Vie du club", value: "club" }
                  - { label: "Événement", value: "event" }
              - { name: titre, label: "Titre", widget: string }
              - { name: texte, label: "Texte", widget: text }
              - { name: image, label: "Photo", widget: image, required: false, hint: "Largeur idéale 1200 px, moins de 500 Ko." }
              - { name: video, label: "Vidéo", widget: file, required: false, hint: "MP4 de préférence, 20 Mo maximum. La vidéo remplace la photo si les deux sont renseignées." }
              - { name: document, label: "Document joint (PDF…)", widget: file, required: false }
              - { name: documentTitre, label: "Nom affiché du document", widget: string, required: false, default: "" }
              - { name: lien, label: "Lien « En savoir plus »", widget: string, required: false, hint: "Adresse complète, ou nom d'une page du site (ex. calendrier.html)" }

      # ------------------ CALENDRIER ------------------
      - name: "matchs"
        label: "Calendrier des matchs"
        file: "content/matchs.json"
        description: "Toutes les rencontres. Renseignez le score après le match : il remplace l'heure sur la carte."
        fields:
          - name: liste
            label: "Rencontres"
            label_singular: "une rencontre"
            widget: list
            summary: "{{fields.date}} — {{fields.equipe}} · {{fields.adversaire}}"
            collapsed: true
            fields:
              - name: equipe
                label: "Équipe"
                widget: select
                default: "A"
                options:
                  - { label: "Séniors A", value: "A" }
                  - { label: "Séniors B", value: "B" }
              - { name: date, label: "Date", widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
              - { name: heure, label: "Heure", widget: string, default: "15:00", hint: "Format 20:00" }
              - { name: competition, label: "Compétition", widget: string, default: "Départemental 2" }
              - { name: journee, label: "Journée", widget: string, default: "Journée 1" }
              - { name: domicile, label: "Match à domicile", widget: boolean, default: true }
              - { name: adversaire, label: "Adversaire", widget: string }
              - { name: score, label: "Score", widget: string, required: false, default: "", hint: "Laisser vide avant le match. Notre score en premier : 3-1" }

      # ------------------ ÉQUIPES ------------------
      - name: "equipes"
        label: "Les équipes"
        file: "content/equipes.json"
        description: "Les fiches des équipes séniors et de l'école de foot."
        fields:
          - name: liste
            label: "Équipes"
            label_singular: "une équipe"
            widget: list
            summary: "{{fields.nom}} — {{fields.niveau}}"
            collapsed: true
            fields:
              - { name: id, label: "Identifiant", widget: string, hint: "Sert aux liens internes. Sans espace ni accent : A, B, jeunes…" }
              - name: couleur
                label: "Couleur du bandeau"
                widget: select
                default: "a"
                options:
                  - { label: "Rouge", value: "a" }
                  - { label: "Bleu", value: "b" }
                  - { label: "Vert", value: "jeunes" }
              - { name: nom, label: "Nom de l'équipe", widget: string }
              - { name: niveau, label: "Championnat", widget: string }
              - { name: photo, label: "Photo d'équipe", widget: image, required: false, hint: "Format paysage. La photo est recadrée en bandeau large : cadrez l'équipe au centre." }
              - { name: legende, label: "Légende de la photo", widget: string, required: false, default: "" }
              - { name: video, label: "Vidéo (si pas de photo)", widget: file, required: false }
              - { name: coach, label: "Encadrement", widget: string }
              - { name: creneaux, label: "Créneaux d'entraînement", widget: string }
              - { name: texte, label: "Présentation", widget: text }
              - { name: fait, label: "À retenir", widget: text }

      # ------------------ ÉVÉNEMENTS ------------------
      - name: "evenements"
        label: "Événements & manifestations"
        file: "content/evenements.json"
        fields:
          - name: liste
            label: "Événements"
            label_singular: "un événement"
            widget: list
            summary: "{{fields.nom}} — {{fields.periode}}"
            collapsed: true
            fields:
              - { name: nom, label: "Nom", widget: string }
              - { name: periode, label: "Période", widget: string, hint: "Exemple : Août, Fin d'année, Printemps" }
              - { name: emoji, label: "Pictogramme", widget: string, default: "⚽", hint: "Un emoji, affiché sur la carte" }
              - { name: texte, label: "Description", widget: text }
              - { name: image, label: "Photo", widget: image, required: false }
              - { name: document, label: "Document joint (affiche, règlement…)", widget: file, required: false }

      # ------------------ PARTENAIRES ------------------
      - name: "partenaires"
        label: "Partenaires"
        file: "content/partenaires.json"
        description: "⚠️ Ne jamais saisir ici de téléphone ou d'e-mail de contact : cette page est publique."
        fields:
          - name: liste
            label: "Partenaires"
            label_singular: "un partenaire"
            widget: list
            summary: "{{fields.nom}} ({{fields.niveau}})"
            collapsed: true
            fields:
              - { name: nom, label: "Nom de l'entreprise", widget: string }
              - name: niveau
                label: "Niveau"
                widget: select
                default: "bronze"
                options:
                  - { label: "Or", value: "or" }
                  - { label: "Argent", value: "argent" }
                  - { label: "Bronze", value: "bronze" }
              - { name: soutien, label: "Ce qu'il finance", widget: string, hint: "Visible publiquement. Exemple : Panneau au stade" }
              - { name: logo, label: "Logo", widget: image, required: false }
              - { name: siteWeb, label: "Site internet", widget: string, required: false, default: "" }

      # ------------------ ORGANISATION ------------------
      - name: "organisation"
        label: "Bureau, conseil & commissions"
        file: "content/organisation.json"
        description: "Un bloc laissé vide disparaît automatiquement de la page Le club."
        fields:
          - name: bureau
            label: "Le bureau"
            label_singular: "un membre du bureau"
            widget: list
            summary: "{{fields.role}} — {{fields.nom}}"
            required: false
            fields:
              - { name: role, label: "Fonction", widget: string }
              - { name: nom, label: "Nom", widget: string }
          - name: conseil
            label: "Le conseil d'administration"
            label_singular: "un membre du conseil"
            widget: list
            summary: "{{fields.nom}} — {{fields.role}}"
            required: false
            fields:
              - { name: nom, label: "Nom", widget: string }
              - { name: role, label: "Rôle / commission", widget: string, required: false, default: "Membre" }
          - name: commissions
            label: "Les commissions"
            label_singular: "une commission"
            widget: list
            summary: "{{fields.nom}}"
            required: false
            fields:
              - { name: nom, label: "Nom de la commission", widget: string }
              - { name: responsable, label: "Référent(s)", widget: string }
              - { name: mission, label: "Mission", widget: text }

      # ------------------ GALERIE ------------------
      - name: "galerie"
        label: "Galerie photos & vidéos"
        file: "content/galerie.json"
        description: "Affichée en bas de la page Équipes. ⚠️ Pas de photo identifiable d'enfant sans l'accord écrit des parents."
        fields:
          - name: liste
            label: "Médias"
            label_singular: "un média"
            widget: list
            summary: "{{fields.legende}}"
            collapsed: true
            fields:
              - { name: fichier, label: "Photo ou vidéo", widget: file }
              - name: type
                label: "Type"
                widget: select
                default: "photo"
                options:
                  - { label: "Photo", value: "photo" }
                  - { label: "Vidéo", value: "video" }
              - { name: legende, label: "Légende", widget: string, required: false, default: "" }

      # ------------------ DOCUMENTS ------------------
      - name: "documents"
        label: "Documents à télécharger"
        file: "content/documents.json"
        description: "Plaquettes, règlements, comptes-rendus. Affichés sur la page correspondant à la catégorie choisie."
        fields:
          - name: liste
            label: "Documents"
            label_singular: "un document"
            widget: list
            summary: "{{fields.titre}}"
            collapsed: true
            fields:
              - { name: titre, label: "Titre", widget: string }
              - { name: fichier, label: "Fichier", widget: file }
              - { name: description, label: "Description", widget: string, required: false, default: "" }
              - name: categorie
                label: "Où l'afficher"
                widget: select
                default: "infos"
                options:
                  - { label: "Page Partenaires", value: "partenaires" }
                  - { label: "Page Infos pratiques", value: "infos" }
                  - { label: "Page Le club", value: "club" }
                  - { label: "Page Événements", value: "evenements" }
