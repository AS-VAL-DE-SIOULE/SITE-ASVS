# ============================================================
#  AS VAL DE SIOULE — configuration du back-office
# ------------------------------------------------------------
#  Le menu de gauche reprend le menu du site, page par page.
#  Chaque rubrique regroupe ce qui alimente la page du même nom.
# ============================================================

backend:
  name: git-gateway
  branch: main

locale: fr
publish_mode: simple

# Tout ce que vous téléversez (photos, vidéos, PDF) atterrit ici
media_folder: "assets/medias"
public_folder: "/assets/medias"

site_url: https://asvaldesioule.com
display_url: https://asvaldesioule.com
logo_url: /assets/img/logo.png

collections:

  # ==========================================================
  #  ACCUEIL
  # ==========================================================
  - name: "accueil"
    label: "Accueil"
    files:
      - name: "club"
        label: "Infos générales du club"
        file: "content/club.json"
        description: "Nom, stade, communes, e-mails, liens. Ces informations alimentent l'accueil, le pied de page et les mentions légales."
        fields:
          - { name: nom, label: "Nom du club", widget: string }
          - { name: fondation, label: "Année de fondation", widget: number, value_type: int }
          - { name: affiliation, label: "Numéro d'affiliation FFF", widget: string }
          - { name: saison, label: "Saison en cours", widget: string, hint: "Exemple : 2026 / 2027" }
          - { name: licencies, label: "Nombre de licenciés", widget: number, value_type: int }
          - { name: email, label: "E-mail général (adresse FFF)", widget: string }
          - { name: emailPartenaires, label: "E-mail partenariats / sponsoring", widget: string }
          - { name: facebook, label: "Adresse de la page Facebook", widget: string }
          - { name: boutique, label: "Adresse de la boutique en ligne", widget: string }
          - { name: stade, label: "Nom du stade", widget: string }
          - { name: ville, label: "Commune du stade", widget: string }
          - { name: codePostal, label: "Code postal", widget: string }
          - { name: communes, label: "Communes du club", widget: list, hint: "Une commune par ligne" }
          - { name: directeurPublication, label: "Directeur de la publication", widget: string, hint: "Le président du club. Apparaît dans les mentions légales." }
          - { name: adresseSiege, label: "Adresse du siège social", widget: string }
          - { name: rna, label: "Numéro RNA de l'association", widget: string, required: false, default: "" }
          - { name: logo, label: "Blason du club", widget: image, hint: "Affiché dans l'en-tête et le pied de page de toutes les pages." }
          - { name: logoDescription, label: "Description du blason", widget: string, hint: "Lue à voix haute par les lecteurs d'écran, et affichée si l'image ne charge pas." }

      - name: "textes-accueil"
        label: "Textes de la page d'accueil"
        file: "content/page-accueil.json"
        description: "Tous les titres, phrases et boutons de la page d'accueil."
        fields:
          - name: hero
            label: "Bandeau d'accueil"
            widget: object
            fields:
              - { name: image, label: "Image de fond du bandeau", widget: image, hint: "Photo affichée derrière le titre de la page." }
              - { name: accroche, label: "Petite phrase manuscrite", widget: string }
              - { name: titre, label: "Grand titre", widget: string }
              - { name: chapeau, label: "Paragraphe d'introduction", widget: text }
              - { name: bouton1, label: "Premier bouton", widget: string }
              - { name: bouton2, label: "Second bouton", widget: string }
              - name: reperes
                label: "Chiffres du bandeau"
                label_singular: "un chiffre"
                widget: list
                summary: "{{fields.valeur}} — {{fields.libelle}}"
                fields:
                  - { name: valeur, label: "Chiffre", widget: string }
                  - { name: libelle, label: "Légende", widget: string }
              - { name: libelleLicencies, label: "Légende sous le nombre de licenciés", widget: string }
              - { name: libelleDomicile, label: "Légende sous le nombre de matchs à domicile", widget: string }
          - name: matchs
            label: "Bloc « prochains rendez-vous »"
            widget: object
            fields:
              - { name: accroche, label: "Petite phrase", widget: string }
              - { name: titre, label: "Titre", widget: string }
              - { name: chapeau, label: "Introduction", widget: text }
              - { name: bouton, label: "Bouton", widget: string }
          - name: histoire
            label: "Bloc « histoire de village »"
            widget: object
            fields:
              - { name: accroche, label: "Petite phrase", widget: string }
              - { name: titre, label: "Titre", widget: string }
              - { name: texte, label: "Texte", widget: text, hint: "Laissez une ligne vide entre deux paragraphes." }
              - { name: bouton, label: "Bouton", widget: string }
              - { name: image, label: "Photo à droite du texte", widget: image }
              - { name: legendeImage, label: "Description de la photo", widget: string }
          - name: equipes
            label: "Bloc « nos équipes »"
            widget: object
            fields:
              - { name: accroche, label: "Petite phrase", widget: string }
              - { name: titre, label: "Titre", widget: string }
              - { name: chapeau, label: "Introduction", widget: text }
              - name: cartes
                label: "Cartes des équipes"
                label_singular: "une carte"
                widget: list
                summary: "{{fields.titre}}"
                fields:
                  - { name: pictogramme, label: "Pictogramme", widget: string, default: "⚽" }
                  - { name: titre, label: "Titre", widget: string }
                  - { name: texte, label: "Texte", widget: text }
                  - { name: lien, label: "Lien", widget: string }
          - name: actus
            label: "Bloc « dernières actualités »"
            widget: object
            fields:
              - { name: accroche, label: "Petite phrase", widget: string }
              - { name: titre, label: "Titre", widget: string }
              - { name: bouton1, label: "Premier bouton", widget: string }
              - { name: bouton2, label: "Second bouton", widget: string }
          - name: chiffres
            label: "Bloc « quelques chiffres »"
            widget: object
            fields:
              - { name: accroche, label: "Petite phrase", widget: string }
              - { name: titre, label: "Titre", widget: string }
              - { name: libelleLicencies, label: "Légende du nombre de licenciés", widget: string }
              - { name: libellePartenaires, label: "Légende du nombre de partenaires", widget: string }
              - { name: libelleMatchs, label: "Légende du nombre de matchs", widget: string }
              - name: autres
                label: "Chiffres supplémentaires"
                label_singular: "un chiffre"
                widget: list
                summary: "{{fields.valeur}} — {{fields.libelle}}"
                fields:
                  - { name: valeur, label: "Chiffre", widget: string }
                  - { name: libelle, label: "Légende", widget: string }
          - name: partenaires
            label: "Bloc « nos partenaires »"
            widget: object
            fields:
              - { name: accroche, label: "Petite phrase", widget: string }
              - { name: titre, label: "Titre", widget: string }
              - { name: chapeau, label: "Introduction", widget: text }
              - { name: bouton, label: "Bouton", widget: string }
          - name: appel
            label: "Bandeau « envie de nous rejoindre »"
            widget: object
            fields:
              - { name: titre, label: "Titre", widget: string }
              - { name: texte, label: "Texte", widget: text }
              - { name: bouton, label: "Bouton", widget: string }
          - name: seo
            label: "Référencement (onglet du navigateur et Google)"
            widget: object
            collapsed: true
            fields:
              - { name: titre, label: "Titre de l'onglet", widget: string, hint: "Affiché dans l'onglet du navigateur et dans les résultats Google." }
              - { name: description, label: "Description pour Google", widget: text, hint: "Deux lignes maximum. Résume ce que contient la page." }

      - name: "navigation"
        label: "Menu et pied de page"
        file: "content/navigation.json"
        description: "Le menu du haut et le pied de page, communs à toutes les pages du site."
        fields:
          - name: menu
            label: "Menu principal"
            label_singular: "une entrée de menu"
            widget: list
            summary: "{{fields.libelle}}"
            fields:
              - { name: libelle, label: "Libellé", widget: string }
              - { name: lien, label: "Page", widget: string, hint: "Exemple : equipes.html" }
              - { name: miseEnAvant, label: "Bouton rouge mis en avant", widget: boolean, default: false, required: false }
          - name: marque
            label: "Logo du haut"
            widget: object
            fields:
              - { name: sousTitre, label: "Sous-titre sous le nom du club", widget: string }
          - name: pied
            label: "Pied de page"
            widget: object
            fields:
              - { name: presentation, label: "Phrase de présentation", widget: text }
              - { name: mentionAffiliation, label: "Mention avant le numéro FFF", widget: string }
              - { name: boutonFacebook, label: "Bouton Facebook", widget: string }
              - { name: boutonBoutique, label: "Bouton boutique", widget: string }
              - name: colonnes
                label: "Colonnes de liens"
                label_singular: "une colonne"
                widget: list
                summary: "{{fields.titre}}"
                fields:
                  - { name: titre, label: "Titre de la colonne", widget: string }
                  - name: liens
                    label: "Liens"
                    label_singular: "un lien"
                    widget: list
                    summary: "{{fields.libelle}}"
                    fields:
                      - { name: libelle, label: "Libellé", widget: string }
                      - { name: lien, label: "Page", widget: string }
              - { name: titreContact, label: "Titre de la colonne contact", widget: string }
              - { name: copyright, label: "Mention de copyright", widget: string }
              - { name: lienMentions, label: "Libellé du lien mentions légales", widget: string }
              - { name: prefixeSaison, label: "Mot avant la saison", widget: string }

  # ==========================================================
  #  LE CLUB
  # ==========================================================
  - name: "le-club"
    label: "Le club"
    files:
      - name: "organisation"
        label: "Bureau, conseil, commissions & arbitres"
        file: "content/organisation.json"
        description: "Alimente la page Le club. Un bloc laissé vide disparaît automatiquement du site."
        fields:
          - name: bureau
            label: "Le bureau"
            label_singular: "un membre du bureau"
            widget: list
            summary: "{{fields.role}} — {{fields.nom}}"
            required: false
            fields:
              - { name: role, label: "Fonction", widget: string }
              - { name: nom, label: "Nom", widget: string }
          - name: conseil
            label: "Le conseil d'administration"
            label_singular: "un membre du conseil"
            widget: list
            summary: "{{fields.nom}} — {{fields.role}}"
            required: false
            fields:
              - { name: nom, label: "Nom", widget: string }
              - { name: role, label: "Rôle / commission", widget: string, required: false, default: "Membre" }
          - name: commissions
            label: "Les commissions"
            label_singular: "une commission"
            widget: list
            summary: "{{fields.nom}}"
            required: false
            fields:
              - { name: nom, label: "Nom de la commission", widget: string }
              - { name: responsable, label: "Référent(s)", widget: string }
              - { name: mission, label: "Mission", widget: text }
          - name: arbitres
            label: "Les arbitres du club"
            label_singular: "un arbitre"
            widget: list
            summary: "{{fields.nom}}"
            required: false
            fields:
              - { name: nom, label: "Nom", widget: string }

      - name: "textes-club"
        label: "Textes de la page Le club"
        file: "content/page-club.json"
        fields:
          - name: hero
            label: "Bandeau de la page"
            widget: object
            fields:
              - { name: image, label: "Image de fond du bandeau", widget: image, hint: "Photo affichée derrière le titre de la page." }
              - { name: filAriane, label: "Libellé dans le fil d'Ariane", widget: string, hint: "Le petit chemin Accueil / … affiché au-dessus du titre." }
              - { name: accroche, label: "Petite phrase", widget: string }
              - { name: titre, label: "Titre", widget: string }
              - { name: chapeau, label: "Introduction", widget: text }
          - name: naissance
            label: "Bloc « naissance d'un club »"
            widget: object
            fields:
              - { name: accroche, label: "Petite phrase", widget: string }
              - { name: titre, label: "Titre", widget: string }
              - { name: texte, label: "Texte", widget: text, hint: "Une ligne vide entre deux paragraphes." }
              - { name: image, label: "Image à droite du texte", widget: image }
              - { name: legendeImage, label: "Description de l'image", widget: string }
          - name: frise
            label: "Bloc « quelques dates »"
            widget: object
            fields:
              - { name: accroche, label: "Petite phrase", widget: string }
              - { name: titre, label: "Titre", widget: string }
              - { name: bouton, label: "Bouton vers la page Histoire", widget: string }
              - name: etapes
                label: "Dates"
                label_singular: "une date"
                widget: list
                summary: "{{fields.annee}}"
                fields:
                  - { name: annee, label: "Année ou période", widget: string }
                  - { name: texte, label: "Texte", widget: text }
          - name: valeurs
            label: "Bloc « nos valeurs »"
            widget: object
            fields:
              - { name: accroche, label: "Petite phrase", widget: string }
              - { name: titre, label: "Titre", widget: string }
              - { name: chapeau, label: "Introduction", widget: text }
              - name: cartes
                label: "Valeurs"
                label_singular: "une valeur"
                widget: list
                summary: "{{fields.titre}}"
                fields:
                  - { name: pictogramme, label: "Pictogramme", widget: string }
                  - { name: titre, label: "Titre", widget: string }
                  - { name: texte, label: "Texte", widget: text }
          - name: organisation
            label: "Titres du bloc organisation"
            widget: object
            fields:
              - { name: accroche, label: "Petite phrase", widget: string }
              - { name: titreBureau, label: "Titre « bureau »", widget: string }
              - { name: chapeauBureau, label: "Introduction du bureau", widget: string }
              - { name: titreConseil, label: "Titre « conseil »", widget: string }
              - { name: chapeauConseil, label: "Introduction du conseil", widget: string }
              - { name: titreCommissions, label: "Titre « commissions »", widget: string }
              - { name: chapeauCommissions, label: "Introduction des commissions", widget: string }
          - name: documents
            label: "Titres du bloc documents"
            widget: object
            fields:
              - { name: accroche, label: "Petite phrase", widget: string }
              - { name: titre, label: "Titre", widget: string }
              - { name: chapeau, label: "Introduction", widget: string }
          - name: territoire
            label: "Bloc « notre territoire »"
            widget: object
            fields:
              - { name: accroche, label: "Petite phrase", widget: string }
              - { name: titre, label: "Titre", widget: string }
              - { name: chapeau, label: "Introduction", widget: text }
              - name: cartes
                label: "Communes"
                label_singular: "une commune"
                widget: list
                summary: "{{fields.titre}}"
                fields:
                  - { name: titre, label: "Nom de la commune", widget: string }
                  - { name: texte, label: "Texte", widget: text }
              - { name: conclusion, label: "Phrase de conclusion", widget: text }
          - name: seo
            label: "Référencement (onglet du navigateur et Google)"
            widget: object
            collapsed: true
            fields:
              - { name: titre, label: "Titre de l'onglet", widget: string, hint: "Affiché dans l'onglet du navigateur et dans les résultats Google." }
              - { name: description, label: "Description pour Google", widget: text, hint: "Deux lignes maximum. Résume ce que contient la page." }

  # ==========================================================
  #  HISTOIRE
  # ==========================================================
  - name: "histoire"
    label: "Histoire"
    files:
      - name: "histoire"
        label: "Notre histoire & le blason"
        file: "content/histoire.json"
        description: "Alimente la page Histoire : signification du blason, chronologie et photos d'équipes d'hier."
        fields:
          - { name: intro, label: "Phrase d'introduction", widget: text }
          - name: blason
            label: "Signification du blason"
            widget: object
            fields:
              - { name: titre, label: "Titre", widget: string }
              - { name: chapeau, label: "Chapeau", widget: string }
              - { name: image, label: "Image du blason", widget: image, required: false }
              - name: elements
                label: "Éléments du blason"
                label_singular: "un élément"
                widget: list
                summary: "{{fields.titre}}"
                fields:
                  - name: couleur
                    label: "Couleur du liseré"
                    widget: select
                    default: "navy"
                    options:
                      - { label: "Rouge", value: "rouge" }
                      - { label: "Vert", value: "vert" }
                      - { label: "Bleu", value: "bleu" }
                      - { label: "Bleu marine", value: "navy" }
                  - { name: titre, label: "Titre", widget: string }
                  - { name: texte, label: "Explication", widget: text }
              - { name: note, label: "Encadré de bas de section", widget: text, required: false }
          - name: chronologie
            label: "Chronologie du club"
            label_singular: "une étape"
            widget: list
            summary: "{{fields.annee}} — {{fields.titre}}"
            collapsed: true
            fields:
              - { name: annee, label: "Année ou période", widget: string, hint: "Exemple : 2009, Juin 2025, 2024-2025" }
              - { name: titre, label: "Titre", widget: string }
              - { name: texte, label: "Récit", widget: text }
              - name: photos
                label: "Photos"
                label_singular: "une photo"
                widget: list
                required: false
                summary: "{{fields.legende}}"
                hint: "Plusieurs photos = diaporama automatique."
                fields:
                  - { name: fichier, label: "Photo", widget: image }
                  - { name: legende, label: "Légende", widget: string, required: false, default: "" }
          - name: equipesHistoriques
            label: "Photos d'équipes au fil des ans"
            label_singular: "une photo d'équipe"
            widget: list
            required: false
            summary: "{{fields.saison}}"
            fields:
              - { name: saison, label: "Saison", widget: string, hint: "Exemple : Saison 2018-2019" }
              - { name: fichier, label: "Photo", widget: image }
              - { name: legende, label: "Légende", widget: string, required: false, default: "" }

      - name: "textes-histoire"
        label: "Titres de la page Histoire"
        file: "content/page-histoire.json"
        fields:
          - name: hero
            label: "Bandeau de la page"
            widget: object
            fields:
              - { name: image, label: "Image de fond du bandeau", widget: image, hint: "Photo affichée derrière le titre de la page." }
              - { name: filAriane, label: "Libellé dans le fil d'Ariane", widget: string, hint: "Le petit chemin Accueil / … affiché au-dessus du titre." }
              - { name: accroche, label: "Petite phrase", widget: string }
              - { name: titre, label: "Titre", widget: string }
          - name: blason
            label: "Bloc du blason"
            widget: object
            fields:
              - { name: accroche, label: "Petite phrase", widget: string }
              - { name: titreEncadre, label: "Titre de l'encadré du bas", widget: string }
          - name: chronologie
            label: "Bloc chronologie"
            widget: object
            fields:
              - { name: accroche, label: "Petite phrase", widget: string }
              - { name: titre, label: "Titre", widget: string }
              - { name: chapeau, label: "Introduction", widget: text }
          - name: equipes
            label: "Bloc photos d'équipes"
            widget: object
            fields:
              - { name: accroche, label: "Petite phrase", widget: string }
              - { name: titre, label: "Titre", widget: string }
              - { name: chapeau, label: "Introduction", widget: string }
          - name: appel
            label: "Bandeau « vous avez des photos »"
            widget: object
            fields:
              - { name: titre, label: "Titre", widget: string }
              - { name: texte, label: "Texte", widget: text }
              - { name: bouton, label: "Bouton", widget: string }
          - name: seo
            label: "Référencement (onglet du navigateur et Google)"
            widget: object
            collapsed: true
            fields:
              - { name: titre, label: "Titre de l'onglet", widget: string, hint: "Affiché dans l'onglet du navigateur et dans les résultats Google." }
              - { name: description, label: "Description pour Google", widget: text, hint: "Deux lignes maximum. Résume ce que contient la page." }

  # ==========================================================
  #  ÉQUIPES
  # ==========================================================
  - name: "equipes"
    label: "Équipes"
    files:
      - name: "equipes"
        label: "Les équipes"
        file: "content/equipes.json"
        description: "Les fiches des équipes séniors et de l'école de foot."
        fields:
          - name: liste
            label: "Équipes"
            label_singular: "une équipe"
            widget: list
            summary: "{{fields.nom}} — {{fields.niveau}}"
            collapsed: true
            fields:
              - { name: id, label: "Identifiant", widget: string, hint: "Sert aux liens internes. Sans espace ni accent : A, B, C, jeunes…" }
              - name: couleur
                label: "Couleur du bandeau"
                widget: select
                default: "a"
                options:
                  - { label: "Rouge", value: "a" }
                  - { label: "Bleu", value: "b" }
                  - { label: "Vert", value: "jeunes" }
              - { name: nom, label: "Nom de l'équipe", widget: string }
              - { name: niveau, label: "Championnat", widget: string }
              - name: photos
                label: "Photos de l'équipe"
                label_singular: "une photo"
                widget: list
                required: false
                summary: "{{fields.legende}}"
                hint: "Plusieurs photos = diaporama automatique. Format paysage, équipe cadrée au centre."
                fields:
                  - { name: fichier, label: "Photo", widget: image }
                  - { name: legende, label: "Légende", widget: string, required: false, default: "" }
              - { name: video, label: "Vidéo (si pas de photo)", widget: file, required: false }
              - { name: coach, label: "Encadrement", widget: string }
              - { name: creneaux, label: "Créneaux d'entraînement", widget: string }
              - { name: texte, label: "Présentation", widget: text }
              - { name: fait, label: "À retenir", widget: text }

      - name: "galerie"
        label: "Galerie photos & vidéos"
        file: "content/galerie.json"
        description: "Affichée en bas de la page Équipes. ⚠️ Pas de photo identifiable d'enfant sans l'accord écrit des parents."
        fields:
          - name: liste
            label: "Médias"
            label_singular: "un média"
            widget: list
            summary: "{{fields.legende}}"
            collapsed: true
            fields:
              - { name: fichier, label: "Photo ou vidéo", widget: file }
              - name: type
                label: "Type"
                widget: select
                default: "photo"
                options:
                  - { label: "Photo", value: "photo" }
                  - { label: "Vidéo", value: "video" }
              - { name: legende, label: "Légende", widget: string, required: false, default: "" }

      - name: "textes-equipes"
        label: "Textes de la page Équipes"
        file: "content/page-equipes.json"
        fields:
          - name: hero
            label: "Bandeau de la page"
            widget: object
            fields:
              - { name: image, label: "Image de fond du bandeau", widget: image, hint: "Photo affichée derrière le titre de la page." }
              - { name: filAriane, label: "Libellé dans le fil d'Ariane", widget: string, hint: "Le petit chemin Accueil / … affiché au-dessus du titre." }
              - { name: accroche, label: "Petite phrase", widget: string }
              - { name: titre, label: "Titre", widget: string }
              - { name: chapeau, label: "Introduction", widget: text }
          - name: encadrement
            label: "Tableau de l'encadrement"
            widget: object
            fields:
              - { name: accroche, label: "Petite phrase", widget: string }
              - { name: titre, label: "Titre", widget: string }
